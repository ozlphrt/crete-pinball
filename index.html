<!DOCTYPE html>
<html lang="en" style="background-color: #061328; height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#061328" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="Crete Pinball — A mobile-first, portrait-oriented offline pinball arcade game set across the Aegean Sea."
    />
    <title>Crete Pinball</title>
  </head>
  <body style="background-color: #061328; height: 100%; margin: 0; padding: 0;">
    <div id="app">
      <div id="game-container"></div>
      <div id="loading-overlay" class="loading-modal-overlay">
        <div class="loading-modal-card">
          <div class="loading-compass-icon">🧭</div>
          <h1 class="loading-title">CRETE PINBALL</h1>
          <div class="loading-subtitle">CHARTING THE AEGEAN ARCHIPELAGO</div>
          <div class="loading-progress-container">
            <div class="loading-progress-track">
              <div id="loading-progress-fill" class="loading-progress-fill" style="width: 0%;"></div>
            </div>
            <div class="loading-stats-row">
              <span id="loading-status-text" class="loading-status-text">Loading Aegean topography...</span>
              <span id="loading-percentage" class="loading-percentage">0%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
